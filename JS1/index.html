<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Exercise 1</title>

    <script>
        function calculate() {
            let first = parseFloat(document.getElementById("num1").value);
            let second = parseFloat(document.getElementById("num2").value);

            if (isNaN(first) || isNaN(second)) {
                alert("Please enter both numbers.");
                return;
            }

            document.getElementById("sum").innerHTML = first + second;
            document.getElementById("difference").innerHTML = first - second;
            document.getElementById("product").innerHTML = first * second;

            if (second == 0) {
                document.getElementById("quotient").innerHTML = "Cannot divide by zero";
            } else {
                document.getElementById("quotient").innerHTML = first / second;
            }
        }

        function clearFields() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";

            document.getElementById("sum").innerHTML = "";
            document.getElementById("difference").innerHTML = "";
            document.getElementById("product").innerHTML = "";
            document.getElementById("quotient").innerHTML = "";

            document.getElementById("num1").focus();
        }
    </script>
</head>

<body>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
    <h1>JS Exercise 1</h1>

    <label>Enter First Number:</label>
    <input type="number" id="num1">
    <br><br>

    <label>Enter Second Number:</label>
    <input type="number" id="num2">
    <br><br>

    <button onclick="calculate()">Calculate</button>
    <button onclick="clearFields()">Clear</button>

    <br><br>

    <p> <b>Sum:</b> <span id="sum"></span></p>
    <p> <b>Difference:</b> <span id="difference"></span></p>
    <p> <b>Product:</b> <span id="product"></span></p>
    <p> <b>Quotient:</b> <span id="quotient"></span></p>

</body>
</html>
