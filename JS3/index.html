<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Manager</title>
</head>
<body>

    <h1>Number Manager</h1>

    <label>Enter Number:</label>
    <input type="number" id="numInput">

    <br><br>

    <button onclick="addNumber()">Add Number</button>
    <button onclick="clearNumbers()">Clear List</button>

    <hr>

    <p><strong>Stored Numbers:</strong> <span id="list">None</span></p>
    <p><strong>Total:</strong> <span id="total">0</span></p>
    <p><strong>Largest:</strong> <span id="largest">-</span></p>
    <p><strong>Smallest:</strong> <span id="smallest">-</span></p>

    <script src="script.js"></script>

</body>
</html>
